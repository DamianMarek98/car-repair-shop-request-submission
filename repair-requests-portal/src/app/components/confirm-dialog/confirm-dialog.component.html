<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button class="motrio-btn-secondary" [mat-dialog-close]="false">Anuluj</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial>{{ data.confirmLabel }}</button>
</mat-dialog-actions>
